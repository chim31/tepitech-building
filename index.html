<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPITECH English Quiz</title>
<meta name="description" content="Révision d'anglais : Reading Comprehension et Text Completion, avec modes Classique, Aléatoire, Mélange, Rush, Survie et Mes erreurs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;--card:#151821;--card2:#1b1f2b;--border:#262a38;--hover:#1e2232;
  --text:#e8e8ef;--dim:#8d8fa0;
  --correct:#2ecc71;--correct-bg:rgba(46,204,113,.12);
  --wrong:#e74c3c;--wrong-bg:rgba(231,76,60,.12);
  --accent:#e67e22;--accent2:#f5a623;--accent-bg:rgba(230,126,34,.12);
}
body[data-sec="t"]{--accent:#6c5ce7;--accent2:#a29bfe;--accent-bg:rgba(108,92,231,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 40%,var(--accent-bg),transparent 55%),radial-gradient(ellipse at 85% 10%,rgba(255,255,255,.025),transparent 50%);pointer-events:none;z-index:0;transition:background .4s}
button{font-family:inherit;color:inherit}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 16px 80px}
.hidden{display:none!important}

/* header */
.header{text-align:center;margin-bottom:28px}
.badge{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:12px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,42px);font-weight:700;line-height:1.15;margin-bottom:8px;background:linear-gradient(135deg,#fff 40%,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--dim);font-size:15px;max-width:540px;margin:0 auto}

/* home */
.h2{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;display:flex;gap:12px;align-items:center}
.tab:hover{border-color:var(--accent)}
.tab .ic{font-size:26px}
.tab b{display:block;font-size:16px}
.tab small{color:var(--dim);font-size:13px}
.tab.on{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-bg),var(--card));box-shadow:0 0 0 1px var(--accent) inset}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{position:relative;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;min-height:112px}
.mode:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.mode.on{border-color:var(--accent);background:linear-gradient(160deg,var(--accent-bg),var(--card));box-shadow:0 0 0 1px var(--accent) inset}
.mode:disabled{opacity:.4;cursor:not-allowed}
.mode .ic{font-size:22px;display:block;margin-bottom:6px}
.mode b{display:block;font-size:15px;margin-bottom:2px}
.mode small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block}
.mode .pill{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong);padding:1px 7px;border-radius:10px}
.settings{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 16px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.set+.set{border-top:1px solid var(--border)}
.set label{font-size:14px;font-weight:600}
.set label small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toggle{width:46px;height:26px;border-radius:13px;background:var(--border);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.start{display:flex;width:100%;justify-content:center;margin-top:22px;padding:16px;font-size:17px}
.bests{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.best{font-size:12.5px;color:var(--dim);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
.best b{color:var(--accent2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-bg)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-sec{background:var(--card2);border:1px solid var(--border);color:var(--text)}
.btn-sec:hover{border-color:var(--accent)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}

/* topbar */
.topbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(21,24,33,.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.tb-mode{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px}
.tb-stat{font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.tb-stat small{color:var(--dim);font-weight:600;font-size:12px}
.tb-sp{flex:1}
.pbar{flex-basis:100%;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease}
.timer{font-variant-numeric:tabular-nums;font-size:18px}
.timer.low{color:var(--wrong);animation:pulse 1s infinite}
.lives{letter-spacing:2px;font-size:15px}

.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.dot{min-width:32px;height:32px;padding:0 4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.dot:hover{border-color:var(--accent);color:var(--text)}
.dot.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.dot.ok{background:var(--correct);border-color:var(--correct);color:#fff}
.dot.bad{background:var(--wrong);border-color:var(--wrong);color:#fff}
.dot.cur.ok,.dot.cur.bad{box-shadow:0 0 0 2px var(--text)}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;margin-bottom:18px;animation:fadeUp .35s ease}
.card-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.num{background:var(--accent-bg);color:var(--accent2);font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap}
.card-title{font-family:'Playfair Display',serif;font-size:20px;line-height:1.3}
.body{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:15.5px;line-height:1.85;margin-bottom:22px}
.gap{display:inline-block;min-width:70px;text-align:center;padding:0 8px;border-radius:6px;background:#262a3d;border:1px dashed #4a4f6a;color:var(--dim);font-weight:600;line-height:1.6}
.gap.filled{border-style:solid;border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}
.gap.ok{border:1px solid var(--correct);background:var(--correct-bg);color:var(--correct)}
.gap.bad{border:1px solid var(--wrong);background:var(--wrong-bg);color:var(--wrong);text-decoration:line-through}
.gap.hl{border-style:solid;border-color:var(--accent);color:var(--accent2);background:var(--accent-bg);min-width:90px}
.qb+.qb{margin-top:22px;padding-top:20px;border-top:1px solid var(--border)}
.qlabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:6px}
.qtext{font-size:16px;font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opts.grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:transparent;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14.5px;cursor:pointer;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--hover)}
.opt:disabled{cursor:default}
.opt .lt{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.sel .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{border-color:var(--correct);background:var(--correct-bg)}
.opt.correct .lt{background:var(--correct);border-color:var(--correct);color:#fff}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.opt.wrong .lt{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.show{border-color:var(--correct);border-style:dashed}
.opt.dim{opacity:.45}
.expl{margin-top:10px;font-size:13.5px;color:#c9c9d6;background:rgba(255,255,255,.03);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 12px}
.expl b{color:var(--accent2)}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:15px;animation:fadeUp .25s ease}
.fb.ok{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
.fb.bad{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{text-align:center;font-size:12px;color:var(--dim);margin-top:10px}
.float{position:fixed;left:50%;top:90px;transform:translateX(-50%);font-weight:800;font-size:22px;pointer-events:none;animation:floatUp .9s ease forwards;z-index:20}
.shake{animation:shake .35s}

/* results */
.results{text-align:center}
.res-emoji{font-size:54px;margin-bottom:8px}
.res-title{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:4px}
.res-sub{color:var(--dim);font-size:14px;margin-bottom:22px}
.res-score{display:inline-flex;align-items:baseline;gap:6px;background:var(--accent-bg);border:1px solid var(--accent);padding:12px 32px;border-radius:14px;margin-bottom:12px}
.res-score .big{font-family:'Playfair Display',serif;font-size:46px;color:var(--accent2)}
.res-score .sm{font-size:18px;color:var(--dim)}
.record{display:block;width:max-content;margin:0 auto 18px;font-size:13px;font-weight:700;color:#1a1a1a;background:linear-gradient(135deg,#f9d423,#f5a623);padding:4px 12px;border-radius:20px;animation:pulse 1.2s infinite}
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:6px auto 24px}
.res-stat{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card2)}
.res-stat .n{font-size:20px;font-weight:700}
.res-stat .l{font-size:11px;color:var(--dim)}
.sc .n{color:var(--correct)}.sw .n{color:var(--wrong)}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rev{margin-top:28px;text-align:left}
.rev-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:12px;text-align:center}
.rev-filter{display:flex;justify-content:center;margin-bottom:14px}
.rev-item{background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rev-hdr{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:6px}
.rev-q{font-size:13.5px;padding:3px 0}
.rev-q .p{color:var(--dim);display:block;margin:2px 0}
.rb{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;white-space:nowrap}
.rb-ok{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
.rb-no{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}
.okt{color:var(--correct);font-weight:700}
.badt{color:var(--wrong);text-decoration:line-through}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:640px){
  .modes{grid-template-columns:1fr 1fr}
  .tabs{grid-template-columns:1fr}
  .card{padding:18px 14px}
  .body{padding:14px;font-size:15px}
  .res-grid{grid-template-columns:1fr 1fr}
  .topbar{gap:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LT='ABCD';
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const fmtTime=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* Extract the sentence(s) around a gap so a Text Completion item can be played on its own. */
function snippet(text,gid){
  const paras=text.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(p=>p.replace(/\.\.(\d+)\.\./g,'§$1§'));
  const mk='§'+gid+'§';
  const pi=paras.findIndex(p=>p.includes(mk));
  if(pi<0)return mk;
  const p=paras[pi];
  if(p.replace(mk,'').trim()==='')return [paras[pi-1],p,paras[pi+1]].filter(Boolean).join('\n');
  const sents=p.split(/(?<=[.!?])\s+(?=[A-Z"])/);
  const si=sents.findIndex(s=>s.includes(mk));
  const parts=[];
  if(si>0)parts.push(sents[si-1]);
  parts.push(sents[si]);
  if(si<sents.length-1&&parts.join(' ').length<160)parts.push(sents[si+1]);
  return parts.join(' ');
}

  t:{name:'Text Completion',short:'Completion',icon:'✍️',unit:'trous',

let cfg=Object.assign({sec:'r',mode:'classic',count:'all',shuffleOpts:true,rushTime:180},store.get('eq_cfg',{}));

const errKey=sec=>'eq_err_'+sec;
const getErrors=sec=>store.get(errKey(sec),[]).filter(k=>ITEMS[k]);
function markError(it,wrong){
  const set=new Set(getErrors(it.sec));
  wrong?set.add(it.key):set.delete(it.key);
  store.set(errKey(it.sec),[...set]);
}
const bestKey=()=>S.sec+'_'+S.mode+(S.mode==='rush'?'_'+S.rushTime:'');

  }

    const v=bests[cfg.sec+'_'+k];

/* ---------- start ---------- */
function permFor(it){const p=it.opts.map((_,i)=>i);return (cfg.shuffleOpts||cfg.mode==='random')?shuffle(p):p}

function start(){
  const sec=SECTIONS[cfg.sec],m=MODES[cfg.mode];
  store.set('eq_cfg',cfg);
  S={sec:cfg.sec,mode:cfg.mode,kind:m.kind,answers:{},perm:{},log:[],score:0,streak:0,bestStreak:0,done:false,rushTime:cfg.rushTime,qid:0};
  if(m.kind==='text'){
    let texts=cfg.mode==='random'?shuffle(sec.texts):sec.texts.slice();
    if(cfg.count!=='all')texts=texts.slice(0,+cfg.count);
    S.texts=texts;S.cur=0;S.checked=texts.map(()=>false);
    texts.forEach(t=>t.items.forEach(it=>S.perm[it.key]=permFor(it)));
    renderText();
  }else{
    let all=sec.texts.flatMap(t=>t.items);
    if(cfg.mode==='errors'){const er=new Set(getErrors(cfg.sec));all=all.filter(i=>er.has(i.key))}
    let pool=shuffle(all);
    if(cfg.mode==='mix'&&cfg.count!=='all')pool=pool.slice(0,+cfg.count);
    if(!pool.length){renderHome();return}
    S.all=all;S.pool=pool;S.i=0;
    if(cfg.mode==='survival')S.lives=3;
    if(cfg.mode==='rush'){S.time=cfg.rushTime;S.timer=setInterval(tick,1000)}
    nextFlash();
  }
  screen('play');
}

/* ---------- text modes (Classique / Aléatoire) ---------- */
function textScore(){
  let c=0,t=0;
  S.texts.forEach((tx,i)=>{if(!S.checked[i])return;tx.items.forEach(it=>{t++;if(S.answers[it.key]===it.ans)c++})});
  return {c,t};
}
function renderText(){
  const t=S.texts[S.cur],ck=S.checked[S.cur],n=S.texts.length;
  const done=S.checked.filter(Boolean).length,{c,t:tot}=textScore();
  const sec=SECTIONS[S.sec];
  const dots=S.texts.map((tx,i)=>{
    let cls=i===S.cur?'cur':'';
    if(S.checked[i])cls+=tx.items.every(it=>S.answers[it.key]===it.ans)?' ok':' bad';
    return `<button class="dot ${cls}" data-act="go" data-v="${i}">${tx.num}</button>`;
  }).join('');
  let body='';
  if(t.body){
    body=esc(t.body).replace(/\n/g,'<br>');
    t.items.forEach(it=>{
      const a=S.answers[it.key];
      let span;
      if(ck){
        span=a===it.ans?`<span class="gap ok">${esc(it.opts[a])}</span>`
          :`<span class="gap bad">${esc(it.opts[a])}</span> <span class="gap ok">${esc(it.opts[it.ans])}</span>`;
      }else span=a!=null?`<span class="gap filled">${esc(it.opts[a])}</span>`:`<span class="gap">${it.gid}</span>`;
      body=body.replace('..'+it.gid+'..',span);
    });
    body=`<div class="body">${body}</div>`;
  }
  const qs=t.items.map((it,ii)=>{
    const a=S.answers[it.key];
    const opts=S.perm[it.key].map((oi,pos)=>{
      let cls='opt';
      if(ck){
        if(oi===it.ans)cls+=a===oi?' correct':' show';
        else if(a===oi)cls+=' wrong';else cls+=' dim';
      }else if(a===oi)cls+=' sel';
      return `<button class="${cls}" data-act="pick" data-v="${ii}:${oi}" ${ck?'disabled':''}><span class="lt">${LT[pos]}</span><span>${esc(it.opts[oi])}</span></button>`;
    }).join('');
    const ex=ck&&it.expl?`<div class="expl"><b>Explication :</b> ${esc(it.expl)}</div>`:'';
    return `<div class="qb"><div class="qlabel">${it.label}</div>${it.prompt?`<div class="qtext">${esc(it.prompt)}</div>`:''}<div class="opts ${it.prompt?'':'grid'}">${opts}</div>${ex}</div>`;
  }).join('');
  const allF=t.items.every(it=>S.answers[it.key]!=null);
  const nextUn=S.checked.findIndex((x,i)=>!x&&i!==S.cur);
  let main;
  if(!ck)main=`<button class="btn btn-primary" data-act="check" ${allF?'':'disabled'}>Vérifier ✓</button>`;
  else if(S.checked.every(Boolean))main=`<button class="btn btn-primary" data-act="finish">Voir les résultats 🏆</button>`;
  else main=`<button class="btn btn-primary" data-act="go" data-v="${S.cur<n-1&&!S.checked[S.cur+1]?S.cur+1:nextUn}">Suivant →</button>`;
  $('#play').innerHTML=`
    <div class="topbar">
      <span class="tb-mode">${sec.icon} ${sec.short} · ${MODES[S.mode].name}</span>
      <span class="tb-stat">Texte ${S.cur+1}<small>/ ${n}</small></span>
      <span class="tb-stat">✓ ${c}<small>/ ${tot}</small></span>
      <span class="tb-sp"></span>
      <button class="btn btn-sec btn-sm" data-act="finish">Terminer</button>
      <button class="btn btn-sec btn-sm" data-act="home">Accueil</button>
      <div class="pbar"><div class="pfill" style="width:${Math.round(done/n*100)}%"></div></div>
    </div>
    ${n>1?`<div class="dots">${dots}</div>`:''}
    <div class="card">
      <div class="card-meta"><span class="num">Texte ${t.num}</span><span class="card-title">${esc(t.title)}</span></div>
      ${body}${qs}
    </div>
    <div class="actions">
      <button class="btn btn-sec" data-act="go" data-v="${S.cur-1}" ${S.cur===0?'style="visibility:hidden"':''}>← Précédent</button>
      ${main}
    </div>`;
}
function checkText(){
  const t=S.texts[S.cur];
  S.checked[S.cur]=true;
  t.items.forEach(it=>{
    const ok=S.answers[it.key]===it.ans;
    S.log.push({it,chosen:S.answers[it.key],ok});
    markError(it,!ok);
  });
  renderText();
}

/* ---------- flash modes (Mélange / Rush / Survie / Erreurs) ---------- */
function nextFlash(){
  if(S.done)return;
  if(S.mode==='survival'&&S.lives<=0)return finish();
  if(S.i>=S.pool.length){
    if(S.mode==='rush'){S.pool=shuffle(S.all);S.i=0}
    else return finish();
  }
  const it=S.pool[S.i++];
  S.q={it,perm:permFor(it)};
  S.answered=null;S.qid++;
  renderFlash();
}
function flashTop(){
  const sec=SECTIONS[S.sec];
  let prog='',pct=0;
  if(S.mode==='rush'){
    prog=`<span class="tb-stat timer ${S.time<=10?'low':''}" id="timer">⏱ ${fmtTime(S.time)}</span>`;
    pct=S.time/S.rushTime*100;
  }else{
    prog=`<span class="tb-stat">Q ${S.i}<small>/ ${S.pool.length}</small></span>`;
    pct=(S.i-(S.answered==null?1:0))/S.pool.length*100;
  }
  const lives=S.mode==='survival'?`<span class="tb-stat lives">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3-S.lives)}</span>`:'';
  return `<div class="topbar">
      <span class="tb-mode">${sec.icon} ${sec.short} · ${MODES[S.mode].name}</span>
      ${prog}
      <span class="tb-stat">✓ ${S.score}</span>
      <span class="tb-stat" title="Série">🔥 ${S.streak}</span>
      ${lives}
      <span class="tb-sp"></span>
      <button class="btn btn-sec btn-sm" data-act="finish">Terminer</button>
      <div class="pbar"><div class="pfill" id="tfill" style="width:${pct}%"></div></div>
    </div>`;
}
function renderSnippet(it,showAns){
  let h=esc(it.snippet).replace(/\n/g,'<br>');
  h=h.replace(/§(\d+)§/g,(m,g)=>{
    if(+g!==it.gid)return '<span class="gap">…</span>';
    if(showAns)return `<span class="gap ok">${esc(it.opts[it.ans])}</span>`;
    return '<span class="gap hl">?</span>';
  });
  return `<div class="body">${h}</div>`;
}
function renderFlash(){
  const {it,perm}=S.q,a=S.answered;
  const chosen=a==null?null:perm[a];
  const opts=perm.map((oi,pos)=>{
    let cls='opt';
    if(a!=null){
      if(oi===it.ans)cls+=' correct';else if(oi===chosen)cls+=' wrong';else cls+=' dim';
    }
    return `<button class="${cls}" data-act="answer" data-v="${pos}" ${a!=null?'disabled':''}><span class="lt">${LT[pos]}</span><span>${esc(it.opts[oi])}</span></button>`;
  }).join('');
  let fb='';
  if(a!=null){
    const ok=chosen===it.ans;
    fb=`<div class="fb ${ok?'ok':'bad'}">${ok?'✓ Correct !':'✗ Réponse : '+esc(it.opts[it.ans])}</div>`;
    if(it.expl)fb+=`<div class="expl"><b>Explication :</b> ${esc(it.expl)}</div>`;
  }
  const last=S.mode!=='rush'&&(S.i>=S.pool.length||(S.mode==='survival'&&S.lives<=0));
  const nextBtn=a!=null&&S.mode!=='rush'
    ?`<div class="actions" style="justify-content:flex-end"><button class="btn btn-primary" data-act="fnext">${last?'Voir les résultats 🏆':'Suivant →'}</button></div><div class="hint">Entrée pour continuer</div>`
    :`<div class="hint">Raccourcis : touches 1–4 ou A–D</div>`;
  $('#play').innerHTML=`${flashTop()}
    <div class="card" id="fcard">
      <div class="card-meta"><span class="num">Texte ${it.num} · ${it.label}</span><span class="card-title">${esc(it.title)}</span></div>
      ${it.prompt?`<div class="qtext" style="font-size:18px">${esc(it.prompt)}</div>`:renderSnippet(it,a!=null)}
      <div class="opts ${it.prompt?'':'grid'}">${opts}</div>
      ${fb}
    </div>${nextBtn}`;
}
function floatMsg(txt,color){
  const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.color=color;
  document.body.appendChild(d);setTimeout(()=>d.remove(),900);
}
function answer(pos){
  if(!S||S.done||S.answered!=null)return;
  const {it,perm}=S.q,chosen=perm[pos],ok=chosen===it.ans;
  S.answered=pos;
  S.log.push({it,chosen,ok});
  markError(it,!ok);
  if(ok){S.score++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);if(S.mode==='rush')floatMsg('+1','var(--correct)')}
  else{
    S.streak=0;
    if(S.mode==='rush'){S.time=Math.max(0,S.time-5);floatMsg('−5 s','var(--wrong)')}
    if(S.mode==='survival')S.lives--;
  }
  renderFlash();
  if(!ok)$('#fcard').classList.add('shake');
  if(S.mode==='rush'){
    if(S.time<=0)return finish();
    const tok=S.qid,cur=S;
    setTimeout(()=>{if(S===cur&&S.qid===tok&&!S.done)nextFlash()},ok?450:1300);
  }
}
function tick(){
  if(!S||S.done)return;
  S.time--;
  const el=$('#timer'),f=$('#tfill');
  if(el){el.textContent='⏱ '+fmtTime(Math.max(0,S.time));el.classList.toggle('low',S.time<=10)}
  if(f)f.style.width=(S.time/S.rushTime*100)+'%';
  if(S.time<=0)finish();
}

/* ---------- results ---------- */
function finish(){
  if(!S)return;
  if(S.timer)clearInterval(S.timer);
  S.done=true;
  const log=S.log;
  if(!log.length){renderHome();return}
  const c=log.filter(l=>l.ok).length,t=log.length,pct=Math.round(c/t*100);
  if(S.kind==='text'){
    let run=0;S.bestStreak=0;
    log.forEach(l=>{run=l.ok?run+1:0;S.bestStreak=Math.max(S.bestStreak,run)});
  }
  const bests=store.get('eq_best',{}),bk=bestKey();
  let rec=false;
  if(S.mode!=='errors'){
    const val=(S.mode==='rush'||S.mode==='survival')?c:pct;
    const fullRun=S.kind==='flash'||S.checked.every(Boolean);
    if(fullRun&&(bests[bk]==null||val>bests[bk])){rec=bests[bk]!=null||val>0;bests[bk]=val;store.set('eq_best',bests)}
  }
  let em='🏆',msg='Excellent !';
  if(pct<50){em='📚';msg='Continue à pratiquer !'}else if(pct<75){em='💪';msg='Pas mal !'}else if(pct<90){em='🌟';msg='Très bien !'}
  if(S.mode==='rush'){em='⏱️';msg=c+' bonnes réponses en '+(S.rushTime/60)+' min'}
  if(S.mode==='survival'){em=S.lives>0?'🏅':'💀';msg=S.lives>0?'Survivant !':'Game over'}
  const sec=SECTIONS[S.sec];
  const remaining=getErrors(S.sec).length;
  const wrongs=log.filter(l=>!l.ok);
  S.revAll=false;
  $('#results').innerHTML=`<div class="card results">
    <div class="res-emoji">${em}</div>
    <div class="res-title">${esc(msg)}</div>
    <div class="res-sub">${sec.name} · ${MODES[S.mode].name}</div>
    <div class="res-score"><span class="big">${c}</span><span class="sm">/ ${t}</span></div>
    ${rec?'<span class="record">🎉 Nouveau record !</span>':''}
    <div class="res-grid">
      <div class="res-stat sc"><div class="n">${c}</div><div class="l">Correctes</div></div>
      <div class="res-stat sw"><div class="n">${t-c}</div><div class="l">Incorrectes</div></div>
      <div class="res-stat"><div class="n">${pct}%</div><div class="l">Réussite</div></div>
      <div class="res-stat"><div class="n">🔥 ${S.bestStreak}</div><div class="l">Meilleure série</div></div>
    </div>
    <div class="res-btns">
      <button class="btn btn-primary" data-act="replay">🔄 Rejouer</button>
      ${remaining?`<button class="btn btn-sec" data-act="errmode">🎯 Mes erreurs (${remaining})</button>`:''}
      <button class="btn btn-sec" data-act="home">🏠 Accueil</button>
    </div>
    <div class="rev"><div class="rev-title">Détail des réponses</div>
      ${wrongs.length&&wrongs.length<log.length?`<div class="rev-filter"><div class="chips"><button class="chip on" data-act="revf" data-v="bad">Erreurs (${wrongs.length})</button><button class="chip" data-act="revf" data-v="all">Tout (${log.length})</button></div></div>`:''}
      <div id="revList"></div>
    </div>
  </div>`;
  renderReview(wrongs.length?'bad':'all');
  screen('results');
}
function renderReview(f){
  const log=f==='bad'?S.log.filter(l=>!l.ok):S.log;
  document.querySelectorAll('[data-act="revf"]').forEach(b=>b.classList.toggle('on',b.dataset.v===f));
  $('#revList').innerHTML=log.map(({it,chosen,ok})=>{
    const good=esc(it.opts[it.ans]);
    const ctx=it.prompt?esc(it.prompt):esc(it.snippet).replace(/§(\d+)§/g,(m,g)=>+g===it.gid?'<b>____</b>':'…').replace(/\n/g,' ');
    const ans=ok?`<span class="okt">${good}</span>`:`<span class="badt">${chosen!=null?esc(it.opts[chosen]):'—'}</span> → <span class="okt">${good}</span>`;
    return `<div class="rev-item"><div class="rev-hdr">Texte ${it.num} — ${esc(it.title)}</div>
      <div class="rev-q"><span class="rb ${ok?'rb-ok':'rb-no'}">${ok?'✓':'✗'} ${it.label}</span>${ans}<span class="p">${ctx}</span>
      ${!ok&&it.expl?`<div class="expl">${esc(it.expl)}</div>`:''}</div></div>`;
  }).join('');
}

/* ---------- events ---------- */
const ACT={
  sec:v=>{cfg.sec=v;renderHome()},
  mode:v=>{cfg.mode=v;if(MODES[v].kind==='text'&&!['5','10','20','all'].includes(cfg.count))cfg.count='all';if(v==='mix'&&!['10','20','40','all'].includes(cfg.count))cfg.count='20';renderHome()},
  count:v=>{cfg.count=v;renderHome()},
  rtime:v=>{cfg.rushTime=+v;renderHome()},
  shuf:()=>{cfg.shuffleOpts=!cfg.shuffleOpts;renderHome()},
  start:()=>start(),
  home:()=>renderHome(),
  replay:()=>start(),
  errmode:()=>{cfg.mode='errors';start()},
  finish:()=>finish(),
  go:v=>{const i=+v;if(i>=0&&i<S.texts.length){S.cur=i;renderText();window.scrollTo({top:0,behavior:'smooth'})}},
  pick:v=>{const [ii,oi]=v.split(':').map(Number);if(S.checked[S.cur])return;S.answers[S.texts[S.cur].items[ii].key]=oi;renderText()},
  check:()=>checkText(),
  answer:v=>answer(+v),
  fnext:()=>{nextFlash();window.scrollTo({top:0,behavior:'smooth'})},
  revf:v=>renderReview(v)
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.v);
});
document.addEventListener('keydown',e=>{
  if(!S||S.done||S.kind!=='flash'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  let pos='1234'.indexOf(k);if(pos<0)pos='abcd'.indexOf(k);
  if(pos>=0&&S.answered==null&&pos<S.q.perm.length){answer(pos);return}
  if((k==='enter'||k===' ')&&S.answered!=null&&S.mode!=='rush'){e.preventDefault();ACT.fnext()}
});

renderHome();
</script>
</body>
</html>
