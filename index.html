      <div class="hero-stats rise" style="--i:1">
        <div class="hstat">${ic('layers')}<b>${total}</b><span>${sec.unit}</span></div>
        <div class="hstat">${ic('trophy')}<b>${bestPct!=null?bestPct+'%':'—'}</b><span>meilleur score</span></div>
        <div class="hstat">${ic('target')}<b>${errs}</b><span>à revoir</span></div>
      </div>
    </section>
    <div class="sec-head rise" style="--i:2"><h2>Choisis ton mode</h2><span>6 façons de réviser</span></div>
    <div class="bento">${cards}</div>
    <div class="launch rise" style="--i:9" id="launch"></div>
    <section class="ext rise" style="--i:10">
      <div class="sec-head"><h2>Quiz en ligne</h2><span>Wayground · nouvel onglet</span></div>
      <div class="ext-grid">${WAYGROUND.map(w=>`<a class="ext-card" href="${w.url}" target="_blank" rel="noopener"><span class="mc-ic">${ic('gamepad')}</span><span><b>${w.name}</b><small>${w.desc}</small></span><span class="go">${ic('external')}</span></a>`).join('')}</div>
    </section>
    <div class="foot rise" style="--i:11">
      <span class="kb">${ic('keyboard')} <kbd>1</kbd>–<kbd>4</kbd> ou <kbd>A</kbd>–<kbd>D</kbd> pour répondre, <kbd>Entrée</kbd> pour continuer</span>
    </div>`;
  renderLaunch();
  if(anim==='enter')setScreen('home');
  else{$('#home').classList.remove('enter');document.body.dataset.screen='home'}
}
function renderLaunch(){
  const m=MODES[cfg.mode],sec=SECTIONS[cfg.sec];
  const chip=(act,v,lbl,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${v}">${lbl}</button>`;
  let f='';
  if(m.kind==='text'||cfg.mode==='mix'){
    const vals=m.kind==='text'?['5','10','20','all']:['10','20','40','all'];
    f+=`<div class="field"><label>${m.kind==='text'?sec.textWord:'Questions'}</label><div class="chipset">${vals.map(v=>chip('count',v,v==='all'?'Tout':v,cfg.count===v)).join('')}</div></div>`;
  }
  if(cfg.mode==='rush')
    f+=`<div class="field"><label>Chrono</label><div class="chipset">${[60,180,300].map(v=>chip('rtime',v,(v/60)+' min',cfg.rushTime===v)).join('')}</div></div>`;
  if(sec.audio&&TTS.ok){
    const vs=TTS.voices.map(v=>`<option value="${esc(v.name)}" ${TTS.voice&&v.name===TTS.voice.name?'selected':''}>${esc(v.name.replace(/^(Microsoft|Google)\s+/,''))} · ${v.lang}</option>`).join('');
    f+=`<div class="field"><label>Voix</label><select class="select" id="voiceSel" aria-label="Voix">${vs||'<option>Voix par défaut</option>'}</select></div>`;
    f+=`<div class="field"><label>Vitesse</label><div class="chipset">${[[0.8,'Lente'],[0.92,'Normale'],[1.05,'Rapide']].map(([v,l])=>chip('rate',v,l,cfg.rate===v)).join('')}<button class="chip" data-act="testvoice" aria-label="Tester la voix">${ic('volume')}</button></div></div>`;
  }
  if(cfg.mode!=='random')
    f+=`<div class="field"><label>Réponses</label><button class="switch" role="switch" aria-checked="${cfg.shuffleOpts}" data-act="shuf"><span class="track"></span>Ordre mélangé</button></div>`;
  $('#launch').innerHTML=`<div class="fields">${f}</div>
    <button class="start" data-act="start"><span class="start-txt"><small>${m.name} · ${sec.short}</small>Commencer</span><span class="start-arrow">${ic('arrowR')}</span></button>`;
}
function selectMode(v){
  cfg.mode=v;
  if(MODES[v].kind==='text'&&!['5','10','20','all'].includes(cfg.count))cfg.count='all';
  if(v==='mix'&&!['10','20','40','all'].includes(cfg.count))cfg.count='20';
  store.set('eq_cfg',cfg);
  document.querySelectorAll('.mcard').forEach(c=>{const on=c.dataset.v===v;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});
  renderLaunch();
}

/* ---------- start ---------- */
function permFor(it){const p=it.opts.map((_,i)=>i);return (cfg.shuffleOpts||cfg.mode==='random')?shuffle(p):p}

function start(){
  const sec=SECTIONS[cfg.sec],m=MODES[cfg.mode];
  store.set('eq_cfg',cfg);
  S={sec:cfg.sec,mode:cfg.mode,kind:m.kind,answers:{},perm:{},log:[],score:0,streak:0,bestStreak:0,done:false,rushTime:cfg.rushTime,qid:0};
  if(m.kind==='text'){
    let texts=cfg.mode==='random'?shuffle(sec.texts):sec.texts.slice();
    if(cfg.count!=='all')texts=texts.slice(0,+cfg.count);
    S.texts=texts;S.cur=0;S.checked=texts.map(()=>false);
    texts.forEach(t=>t.items.forEach(it=>S.perm[it.key]=permFor(it)));
    setScreen('play');renderText(false,true);
  }else{
    let all=sec.texts.flatMap(t=>t.items);
    if(cfg.mode==='errors'){const er=new Set(getErrors(cfg.sec));all=all.filter(i=>er.has(i.key))}
    let pool=shuffle(all);
    if(cfg.mode==='mix'&&cfg.count!=='all')pool=pool.slice(0,+cfg.count);
    if(!pool.length){renderHome();return}
    S.all=all;S.pool=pool;S.i=0;
    if(cfg.mode==='survival')S.lives=3;
    if(cfg.mode==='rush'){S.time=cfg.rushTime;S.timer=setInterval(tick,1000)}
    setScreen('play');nextFlash();
  }
}

/* ---------- HUD ---------- */
function hud(statsHtml,pct){
  const sec=SECTIONS[S.sec],m=MODES[S.mode];
  return `<div class="hud">
    <button class="icon-btn" data-act="home" aria-label="Accueil">${ic('home')}</button>
    <div class="hud-mode"><span class="mc-ic">${ic(m.icon)}</span><div><small>${sec.short}</small><b>${m.name}</b></div></div>
    <div class="hud-stats">${statsHtml}</div>
    <button class="btn btn-ghost btn-sm finish-btn" data-act="finish">${ic('flag')}Terminer</button>
    <div class="hud-bar"><i id="hbar" style="width:${pct}%"></i></div>
  </div>`;
}
const C20=2*Math.PI*8;
function timerPill(){
  const off=C20*(1-S.time/S.rushTime);
  return `<span class="pill timer ${S.time<=10?'low':''}" id="timer"><svg class="ring" viewBox="0 0 20 20"><circle class="tr" cx="10" cy="10" r="8"/><circle class="pr" id="tring" cx="10" cy="10" r="8" stroke-dasharray="${C20}" stroke-dashoffset="${off}"/></svg><span id="ttext">${fmtTime(S.time)}</span></span>`;
}

/* ---------- shared pieces: documents, audio player, prompts ---------- */
let DOCS={};
function docCol(t){
  const imgs=t.images||[];
  if(!imgs.length)return '';
  DOCS.doc=imgs;
  return `<aside class="doc-col" aria-label="Document">
    <div class="doc-head"><span>${ic('file')}${esc(t.kind||'Document')}</span><span>${imgs.length} page${imgs.length>1?'s':''}</span></div>
    ${imgs.map((src,i)=>`<button class="doc-img" data-act="zoom" data-v="doc:${i}" aria-label="Agrandir la page ${i+1}"><img src="${src}" alt="${esc(t.title)} — page ${i+1}" loading="lazy" decoding="async"><span class="zoom">${ic('zoom')}</span></button>`).join('')}
  </aside>`;
}
function capBtn(src){
  if(!src)return '';
  DOCS.cap=[src];
  return `<button class="cap-btn" data-act="zoom" data-v="cap:0">${ic('image')}Capture</button>`;
}
const WAVE=Array.from({length:34},(_,i)=>`<i style="--d:${((i*37)%100)/100}"></i>`).join('');
function player(it,revealed){
  const canText=it.transcript||it.audioOnly;
  return `<div class="player ${TTS.playing&&TTS.key===it.key?'playing':''}" data-key="${it.key}">
    <button class="play-btn" data-act="play" aria-label="Écouter">${ic('play','fill i-play')}${ic('stop','fill i-stop')}</button>
    <div class="wave">${WAVE}</div>
    <div class="player-meta"><small>${TTS.ok?'<kbd>R</kbd> réécouter':'Audio indisponible ici'}</small>
      ${canText?`<button class="cap-btn" data-act="transcript">${ic('eye')}${revealed?'Masquer le texte':'Afficher le texte'}</button>`:''}</div>
  </div>
  ${it.transcript&&revealed?`<div class="transcript"><b>Transcription</b>${esc(it.transcript)}</div>`:''}`;
}
function promptHtml(it,revealed,answered,cls){
  if(it.audioOnly&&!revealed)return `<div class="${cls}"><span class="masked"></span></div>`;
  let h=esc(it.prompt);
  if(it.gapPrompt)h=h.replace(/_{2,}/g,answered?`<span class="gap ok">${esc(it.opts[it.ans])}</span>`:'<span class="gap hl">?</span>');
  return `<div class="${cls}">${h}</div>`;
}
function optHtml(it,oi,pos,cls,key,act,disabled,revealed){
  const text=it.audioOnly&&!revealed?'<span class="masked"></span>':esc(it.opts[oi]);
  const say=it.audioOnly&&TTS.ok?`<span class="say" data-act="say" data-v="${oi}:${pos}" role="button" aria-label="Écouter la réponse ${LT[pos]}">${ic('volume')}</span>`:'';
  return `<button class="${cls}" data-act="${act}" data-v="${act==='pick'?key:pos}" ${disabled?'disabled':''}><span class="key">${cls.includes('correct')||cls.includes(' show')?ic('check'):cls.includes('wrong')?ic('x'):LT[pos]}</span><span>${text}</span>${say}</button>`;
}
function autoPlay(it){
  if(!it||!it.speech||!TTS.ok)return;
  const cur=S;
  setTimeout(()=>{if(S===cur&&!S.done&&curItem()===it)TTS.speak(it.speech,it.key)},380);
}
function curItem(){
  if(!S)return null;
  if(S.kind==='flash')return S.q&&S.q.it;
  return S.texts[S.cur].items.find(i=>i.speech)||null;
}
function bodyHtml(t,ck){
  if(!t.body)return '';
  let body=esc(t.body).replace(/\n/g,'<br>');
  t.items.forEach(it=>{
    if(!it.gid)return;
    const a=S.answers[it.key];
    let span;
    if(ck){
      span=a===it.ans?`<span class="gap ok">${esc(it.opts[a])}</span>`
        :`<span class="gap bad">${esc(it.opts[a])}</span> <span class="gap ok">${esc(it.opts[it.ans])}</span>`;
    }else span=a!=null?`<span class="gap filled">${esc(it.opts[a])}</span>`:`<span class="gap"><span class="n">${it.gid}</span></span>`;
    body=body.replace('..'+it.gid+'..',span);
  });
  return `<div class="passage">${body}</div>`;
}

/* ---------- text modes (Classique / Aléatoire) ---------- */
function textScore(){
  let c=0,t=0;
  S.texts.forEach((tx,i)=>{if(!S.checked[i])return;tx.items.forEach(it=>{t++;if(S.answers[it.key]===it.ans)c++})});
  return {c,t};
}
function renderText(bumpScore,fresh){
  const t=S.texts[S.cur],ck=S.checked[S.cur],n=S.texts.length,sec=SECTIONS[S.sec];
  const done=S.checked.filter(Boolean).length,{c,t:tot}=textScore();
  DOCS={};
  const rail=S.texts.map((tx,i)=>{
    let cls=i===S.cur?'cur':'';
    if(S.checked[i]&&i!==S.cur)cls=tx.items.every(it=>S.answers[it.key]===it.ans)?'ok':'bad';
    return `<button class="${cls}" data-act="go" data-v="${i}" aria-label="${tx.kind||'Texte'} ${tx.num}">${pad(tx.num)}</button>`;
  }).join('');
  const reveal=S.reveal||ck;
  const qs=t.items.map((it,ii)=>{
    const a=S.answers[it.key];
    const opts=S.perm[it.key].map((oi,pos)=>{
      let cls='opt';
      if(ck){
        if(oi===it.ans)cls+=a===oi?' correct':' show';
        else if(a===oi)cls+=' wrong';else cls+=' dim';
      }else if(a===oi)cls+=' sel';
      return optHtml(it,oi,pos,cls,`${ii}:${oi}`,'pick',ck,reveal);
    }).join('');
    const ex=ck&&it.expl?`<div class="explain">${ic('bulb')}<div>${esc(it.expl)}</div></div>`:'';
    const label=it.gid
      ?`<div class="qlabel"><span class="qtag">${it.gid}</span><span class="qprompt" style="color:var(--muted);font-weight:500">Choisis le mot du trou ${it.gid}</span></div>`
      :`<div class="qlabel"><span class="qtag">${t.items.length>1?it.label:(it.speech?ic('headphones'):'Q')}</span>${promptHtml(it,reveal,ck,'qprompt')}</div>`;
    return `<div class="qb">${it.speech?player(it,reveal):''}${label}<div class="options ${it.gid||it.opts.every(o=>o.length<26)?'grid':''}">${opts}</div>${ex}</div>`;
  }).join('');
  const allF=t.items.every(it=>S.answers[it.key]!=null);
  const nextUn=S.checked.findIndex((x,i)=>!x&&i!==S.cur);
  let main;
  if(!ck)main=`<button class="btn btn-primary" data-act="check" ${allF?'':'disabled'}>${ic('check')}Vérifier</button>`;
  else if(S.checked.every(Boolean))main=`<button class="btn btn-primary" data-act="finish">${ic('trophy')}Voir les résultats</button>`;
  else main=`<button class="btn btn-primary" data-act="go" data-v="${S.cur<n-1&&!S.checked[S.cur+1]?S.cur+1:nextUn}">Suivant${ic('arrowR')}</button>`;
  const stats=`<span class="pill">${ic('file')}${pad(S.cur+1)}<small>/${pad(n)}</small></span><span class="pill ok ${bumpScore?'bump':''}">${ic('check')}${c}<small>/${tot}</small></span>`;
  const card=`<article class="qcard rise" style="--i:1">
      <div class="qhead-row"><div class="qhead"><span class="qnum">${esc(t.kind||'Texte')} ${pad(t.num)} · ${t.items.length} ${t.items[0].gid?'trous':t.items.length>1?'questions':'question'}</span><h2 class="qtitle">${esc(t.title)}</h2></div>${capBtn(t.capture)}</div>
      ${bodyHtml(t,ck)}${qs}
    </article>
    <div class="actions">
      <button class="btn btn-ghost" data-act="go" data-v="${S.cur-1}" ${S.cur===0?'style="visibility:hidden"':''}>${ic('arrowL')}Précédent</button>
      ${main}
    </div>`;
  const doc=docCol(t);
  $('#play').innerHTML=`${hud(stats,Math.round(done/n*100))}
    ${n>1?`<nav class="rail" aria-label="${sec.textWord}">${rail}</nav>`:''}
    ${doc?`<div class="doc-layout">${doc}<div>${card}</div></div>`:card}`;
  if(!fresh)$('#play').classList.remove('enter');
  const cur=$('.rail .cur');
  if(cur)cur.parentNode.scrollTo({left:cur.offsetLeft-cur.parentNode.clientWidth/2+cur.clientWidth/2,behavior:fresh?'smooth':'instant'});
  if(fresh)autoPlay(t.items.find(i=>i.speech));
}
function checkText(){
  const t=S.texts[S.cur];
  S.checked[S.cur]=true;
  let allOk=true;
  t.items.forEach(it=>{
    const ok=S.answers[it.key]===it.ans;
    if(!ok)allOk=false;
    S.log.push({it,chosen:S.answers[it.key],ok});
    markError(it,!ok);
  });
  renderText(true);
  if(allOk){toast(ic('sparkles')+' Sans faute !');const b=$('.actions .btn-primary').getBoundingClientRect();confetti(b.left+b.width/2,b.top,22)}
}

/* ---------- flash modes (Mélange / Rush / Survie / Erreurs) ---------- */
function nextFlash(){
  if(S.done)return;
  if(S.mode==='survival'&&S.lives<=0)return finish();
  if(S.i>=S.pool.length){
    if(S.mode==='rush'){S.pool=shuffle(S.all);S.i=0}
    else return finish();
  }
  const it=S.pool[S.i++];
  S.q={it,perm:permFor(it)};
  S.answered=null;S.qid++;S.fx=null;
  renderFlash(true);
}
function renderSnippet(it,showAns){
  let h=esc(it.snippet).replace(/\n/g,'<br>');
  h=h.replace(/§(\d+)§/g,(m,g)=>{
    if(+g!==it.gid)return '<span class="gap">…</span>';
    if(showAns)return `<span class="gap ok">${esc(it.opts[it.ans])}</span>`;
    return '<span class="gap hl">?</span>';
  });
  return `<div class="passage">${h}</div>`;
}
function renderFlash(fresh){
  const {it,perm}=S.q,a=S.answered,fx=S.fx||{};
  const chosen=a==null?null:perm[a];
  const reveal=S.reveal||a!=null;
  DOCS={};
  const opts=perm.map((oi,pos)=>{
    let cls='opt';
    if(a!=null){
      if(oi===it.ans)cls+=' correct';
      else if(oi===chosen)cls+=' wrong';else cls+=' dim';
    }
    return optHtml(it,oi,pos,cls,null,'answer',a!=null,reveal);
  }).join('');
  let fb='';
  if(a!=null){
    const ok=chosen===it.ans;
    fb=ok?`<div class="verdict ok"><span class="vi">${ic('check')}</span><span>Correct${S.streak>=3?` — série de <b>${S.streak}</b>`:''}</span></div>`
         :`<div class="verdict bad"><span class="vi">${ic('x')}</span><span>Bonne réponse : <b>${esc(it.opts[it.ans])}</b></span></div>`;
    if(it.expl)fb+=`<div class="explain">${ic('bulb')}<div>${esc(it.expl)}</div></div>`;
  }
  let stats='',pct;
  if(S.mode==='rush'){stats+=timerPill();pct=S.time/S.rushTime*100}
  else{stats+=`<span class="pill">${ic('file')}${S.i}<small>/${S.pool.length}</small></span>`;pct=(S.i-(a==null?1:0))/S.pool.length*100}
  stats+=`<span class="pill ok ${fx.ok?'bump':''}">${ic('check')}${S.score}</span>`;
  stats+=`<span class="pill fire ${S.streak>=3?'hot':''} ${fx.ok&&S.streak>=2?'bump':''}">${ic('flame')}${S.streak}</span>`;
  if(S.mode==='survival')stats+=`<span class="pill hearts">${[0,1,2].map(i=>ic('heart',i<S.lives?'fill':'lost'+(fx.lost&&i===S.lives?' just':''))).join('')}</span>`;
  const last=S.mode!=='rush'&&(S.i>=S.pool.length||(S.mode==='survival'&&S.lives<=0));
  const after=a!=null&&S.mode!=='rush'
    ?`<div class="actions center" style="${it.images.length?'max-width:none':''}"><button class="btn btn-primary" data-act="fnext">${last?ic('trophy')+'Voir les résultats':'Suivant'+ic('arrowR')}</button></div><div class="hint"><kbd>Entrée</kbd> pour continuer</div>`
    :`<div class="hint">Réponds avec <kbd>1</kbd>–<kbd>4</kbd> ou <kbd>A</kbd>–<kbd>D</kbd>${it.speech?' · <kbd>R</kbd> pour réécouter':''}</div>`;
  const t=SECTIONS[S.sec].texts.find(x=>x.items.includes(it));
  const doc=docCol({images:it.images,kind:t&&t.kind,title:it.title});
  const card=`<article class="qcard ${doc?'':'focus'} ${fresh?'rise':''}" style="--i:0">
      <div class="qhead-row"><div class="qhead"><span class="qnum">${esc(t?t.kind:'Texte')} ${pad(it.num)} · ${it.label}</span><span class="rev-meta" style="margin:0">${esc(it.title)}</span></div>${capBtn(it.capture)}</div>
      ${it.speech?player(it,reveal):''}
      ${it.gid?renderSnippet(it,a!=null):promptHtml(it,reveal,a!=null,'prompt')}
      <div class="options ${it.gid||it.opts.every(o=>o.length<26)?'grid':''}">${opts}</div>
      ${fb}
    </article>${after}`;
  $('#play').innerHTML=`${hud(stats,pct)}${doc?`<div class="doc-layout">${doc}<div>${card}</div></div>`:card}`;
  if(!fresh)$('#play').classList.remove('enter');
  else autoPlay(it);
}
function answer(pos){
  if(!S||S.done||S.answered!=null)return;
  const {it,perm}=S.q,chosen=perm[pos],ok=chosen===it.ans;
  S.answered=pos;
  S.log.push({it,chosen,ok});
  markError(it,!ok);
  S.fx={ok};
  if(ok){
    S.score++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(S.mode==='rush')floatMsg('+1','var(--ok)');
    if(S.streak>0&&S.streak%5===0)toast(ic('flame')+` Série de ${S.streak} !`);
  }else{
    S.streak=0;
    if(S.mode==='rush'){S.time=Math.max(0,S.time-5);floatMsg('−5s','var(--bad)')}
    if(S.mode==='survival'){S.lives--;S.fx.lost=true}
  }
  renderFlash(false);
  if(S.mode==='rush'){
    if(S.time<=0)return finish();
    const tok=S.qid,cur=S;
    setTimeout(()=>{if(S===cur&&S.qid===tok&&!S.done)nextFlash()},ok?500:1400);
  }
}
function tick(){
  if(!S||S.done)return;
  S.time--;
  const p=$('#timer'),tt=$('#ttext'),r=$('#tring'),b=$('#hbar');
  if(tt)tt.textContent=fmtTime(Math.max(0,S.time));
  if(p)p.classList.toggle('low',S.time<=10);
  if(r)r.setAttribute('stroke-dashoffset',C20*(1-Math.max(0,S.time)/S.rushTime));
  if(b)b.style.width=(S.time/S.rushTime*100)+'%';
  if(S.time<=0)finish();
}

/* ---------- results ---------- */
function finish(){
  if(!S)return;
  TTS.stop();
  if(S.timer)clearInterval(S.timer);
  S.done=true;
  const log=S.log;
  if(!log.length){renderHome();return}
  const c=log.filter(l=>l.ok).length,t=log.length,pct=Math.round(c/t*100);
  if(S.kind==='text'){
    let run=0;S.bestStreak=0;
    log.forEach(l=>{run=l.ok?run+1:0;S.bestStreak=Math.max(S.bestStreak,run)});
  }
  const bests=store.get('eq_best',{}),bk=bestKey();
  let rec=false;
  if(S.mode!=='errors'){
    const val=(S.mode==='rush'||S.mode==='survival')?c:pct;
    const fullRun=S.kind==='flash'||S.checked.every(Boolean);
    if(fullRun&&(bests[bk]==null||val>bests[bk])){rec=bests[bk]!=null||val>0;bests[bk]=val;store.set('eq_best',bests)}
  }
  let title='Continue <em>comme ça.</em>',sub='Chaque erreur est une question de moins à l’examen.';
  if(pct>=90){title='Ex<em>cellent.</em>';sub='Presque parfait — tu maîtrises le sujet.'}
  else if(pct>=75){title='Très <em>bien.</em>';sub='Encore quelques détails et c’est parfait.'}
  else if(pct>=50){title='Pas <em>mal.</em>';sub='La moitié est faite — revois tes erreurs.'}
  if(S.mode==='rush'){title=`<em>${c}</em> en ${S.rushTime/60} min.`;sub=`${t} questions tentées, ${t-c} erreurs.`}
  if(S.mode==='survival'){title=S.lives>0?'Sur<em>vivant.</em>':'Game <em>over.</em>';sub=`${c} bonne${c>1?'s':''} réponse${c>1?'s':''} avant la chute.`}
  const sec=SECTIONS[S.sec],m=MODES[S.mode];
  const remaining=getErrors(S.sec).length;
  const wrongs=log.filter(l=>!l.ok);
  const C=2*Math.PI*80;
  $('#results').innerHTML=`
    <section class="res-hero rise" style="--i:0">
      <div class="score-ring">
        <svg viewBox="0 0 184 184"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
          <circle class="tr" cx="92" cy="92" r="80"/><circle class="pr" id="sring" cx="92" cy="92" r="80" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="center"><b><span data-count="${pct}">0</span><small>%</small></b><span class="lbl">réussite</span></div>
      </div>
      <div class="res-copy">
        <div class="eyebrow" style="margin:0">${ic(m.icon)} ${m.name} · ${sec.short}${rec?`<span class="record">${ic('sparkles')}Record</span>`:''}</div>
        <h2>${title}</h2>
        <p>${sub}</p>
        <div class="res-btns">
          <button class="btn btn-primary" data-act="replay">${ic('redo')}Rejouer</button>
          ${remaining?`<button class="btn btn-ghost" data-act="errmode">${ic('target')}Mes erreurs · ${remaining}</button>`:''}
          <button class="btn btn-ghost" data-act="home">${ic('home')}Accueil</button>
        </div>
      </div>
    </section>
    <div class="tiles">
      <div class="tile ok rise" style="--i:1">${ic('check')}<b data-count="${c}">0</b><span>correctes</span></div>
      <div class="tile bad rise" style="--i:2">${ic('x')}<b data-count="${t-c}">0</b><span>incorrectes</span></div>
      <div class="tile rise" style="--i:3">${ic('layers')}<b data-count="${t}">0</b><span>${sec.unit} jouées</span></div>
      <div class="tile fire rise" style="--i:4">${ic('flame')}<b data-count="${S.bestStreak}">0</b><span>meilleure série</span></div>
    </div>
    <div class="review-head rise" style="--i:5">
      <h2 style="font:400 30px/1 var(--font-serif)">Détail des réponses</h2>
      ${wrongs.length&&wrongs.length<log.length?`<div class="chipset"><button class="chip on" data-act="revf" data-v="bad">Erreurs · ${wrongs.length}</button><button class="chip" data-act="revf" data-v="all">Tout · ${log.length}</button></div>`:''}
    </div>
    <div class="rev" id="revList"></div>`;
  renderReview(wrongs.length?'bad':'all');
  setScreen('results');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const r=$('#sring');if(r)r.style.strokeDashoffset=C*(1-pct/100);
    countUp($('#results'));
  }));
  if(rec||pct===100)setTimeout(()=>{const r=$('.score-ring');if(!r)return;const b=r.getBoundingClientRect();confetti(b.left+b.width/2,b.top+b.height/2,46)},700);
}
function renderReview(f){
  const log=f==='bad'?S.log.filter(l=>!l.ok):S.log;
  document.querySelectorAll('[data-act="revf"]').forEach(b=>b.classList.toggle('on',b.dataset.v===f));
  $('#revList').innerHTML=log.map(({it,chosen,ok},i)=>{
    const good=esc(it.opts[it.ans]);
    const ctx=it.prompt?esc(it.prompt):esc(it.snippet).replace(/§(\d+)§/g,(m,g)=>+g===it.gid?'<b>_____</b>':'…').replace(/\n/g,' ');
    const ans=ok?`<span class="okt">${good}</span>`:`<span class="badt">${chosen!=null?esc(it.opts[chosen]):'—'}</span>${ic('arrowR')}<span class="okt">${good}</span>`;
    return `<div class="rev-item" style="animation-delay:${Math.min(i,12)*35}ms"><span class="rev-dot ${ok?'ok':'bad'}">${ic(ok?'check':'x')}</span><div>
      <div class="rev-meta">Texte ${pad(it.num)} · ${it.label} · ${esc(it.title)}</div>
      <div class="rev-q">${ctx}</div>
      <div class="rev-a">${ans}</div>
      ${!ok&&it.expl?`<div class="explain">${ic('bulb')}<div>${esc(it.expl)}</div></div>`:''}</div></div>`;
  }).join('');
}

/* ---------- events ---------- */
const ACT={
  sec:v=>{if(v===cfg.sec&&document.body.dataset.screen==='home')return;cfg.sec=v;renderHome(document.body.dataset.screen==='home'?'swap':'enter')},
  mode:v=>selectMode(v),
  count:v=>{cfg.count=v;store.set('eq_cfg',cfg);renderLaunch()},
  rtime:v=>{cfg.rushTime=+v;store.set('eq_cfg',cfg);renderLaunch()},
  shuf:()=>{cfg.shuffleOpts=!cfg.shuffleOpts;store.set('eq_cfg',cfg);renderLaunch()},
  theme:(v,b)=>toggleTheme(b),
  start:()=>start(),
  home:()=>renderHome(),
  replay:()=>start(),
  errmode:()=>{cfg.mode='errors';start()},
  finish:()=>finish(),
  go:v=>{const i=+v;if(i>=0&&i<S.texts.length){S.cur=i;renderText(false,true);window.scrollTo({top:0,behavior:'smooth'})}},
  pick:v=>{const [ii,oi]=v.split(':').map(Number);if(S.checked[S.cur])return;S.answers[S.texts[S.cur].items[ii].key]=oi;renderText();$('#play').classList.remove('enter')},
  check:()=>checkText(),
  answer:v=>answer(+v),
  fnext:()=>{nextFlash();window.scrollTo({top:0,behavior:'smooth'})},
  revf:v=>renderReview(v),
  rate:v=>{cfg.rate=+v;store.set('eq_cfg',cfg);renderLaunch();TTS.speak('This is how the questions will sound.','test')},
  testvoice:()=>TTS.speak('This is how the questions will sound.','test'),
  play:()=>{const it=curItem();if(!it||!it.speech)return;if(TTS.playing&&TTS.key===it.key)TTS.stop();else TTS.speak(it.speech,it.key)},
  say:v=>{const [oi,pos]=v.split(':').map(Number);const it=curItem();if(it)TTS.speak(LT[pos]+'. '+it.opts[oi],it.key)},
  transcript:()=>{S.reveal=!S.reveal;S.kind==='flash'?renderFlash(false):renderText()},
  zoom:v=>{const [list,i]=v.split(':');openLightbox(DOCS[list]||[],+i)},
  lbclose:()=>closeLightbox(),
  lbstep:v=>stepLightbox(+v)
};
let LB=null;
function openLightbox(list,i){
  if(!list.length)return;
  LB={list,i};
  document.querySelector('.lightbox')?.remove();
  const el=document.createElement('div');el.className='lightbox';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  document.body.appendChild(el);drawLightbox();
}
function drawLightbox(){
  const el=document.querySelector('.lightbox');if(!el||!LB)return;
  const n=LB.list.length;
  el.innerHTML=`<div class="lb-bar">${n>1?`<button class="icon-btn" data-act="lbstep" data-v="-1" aria-label="Page précédente">${ic('chevL')}</button><span>${LB.i+1} / ${n}</span><button class="icon-btn" data-act="lbstep" data-v="1" aria-label="Page suivante">${ic('chevR')}</button>`:''}<button class="icon-btn" data-act="lbclose" aria-label="Fermer">${ic('x')}</button></div><img src="${LB.list[LB.i]}" alt="Document agrandi">`;
}
function stepLightbox(d){if(!LB)return;LB.i=(LB.i+d+LB.list.length)%LB.list.length;drawLightbox()}
function closeLightbox(){document.querySelector('.lightbox')?.remove();LB=null}
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('lightbox'))closeLightbox()});
document.addEventListener('change',e=>{
  if(e.target.id==='voiceSel'){cfg.voice=e.target.value;store.set('eq_cfg',cfg);TTS.voice=TTS.voices.find(v=>v.name===cfg.voice)||TTS.voice;TTS.speak('This is how the questions will sound.','test')}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.v,b);
});
document.addEventListener('pointermove',e=>{
  const c=e.target.closest&&e.target.closest('.mcard');
  if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'&&e.target.matches('.brand')){renderHome();return}
  if(LB){if(e.key==='Escape')closeLightbox();else if(e.key==='ArrowRight')stepLightbox(1);else if(e.key==='ArrowLeft')stepLightbox(-1);return}
  if(e.target.matches&&e.target.matches('select,input,textarea'))return;
  const k=e.key.toLowerCase();
  if(S&&!S.done&&k==='r'&&curItem()&&curItem().speech){const it=curItem();TTS.speak(it.speech,it.key);return}
  if(S&&!S.done&&k==='t'&&curItem()&&(curItem().transcript||curItem().audioOnly)){ACT.transcript();return}
  if(!S||S.done||S.kind!=='flash')return;
  let pos='1234'.indexOf(k);if(pos<0)pos='abcd'.indexOf(k);
  if(pos>=0&&S.answered==null&&pos<S.q.perm.length){answer(pos);return}
  if((k==='enter'||k===' ')&&S.answered!=null&&S.mode!=='rush'){e.preventDefault();ACT.fnext()}
});

renderHome();
</script>
</body>
</html>
