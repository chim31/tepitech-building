<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Comprehension — Revision Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--card:#14171f;--accent:#e67e22;--accent2:#f39c12;--correct:#27ae60;--correct-bg:rgba(39,174,96,.12);--wrong:#e74c3c;--wrong-bg:rgba(231,76,60,.12);--text:#e8e8ef;--dim:#8a8a9a;--border:#252836;--hover:#1c2030}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(230,126,34,.04),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(243,156,18,.03),transparent 50%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:32px 20px 80px}

.header{text-align:center;margin-bottom:40px}
.badge{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(26px,5vw,40px);font-weight:700;margin-bottom:10px;background:linear-gradient(135deg,#fff 40%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--dim);font-size:14px;max-width:520px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-label{font-size:13px;color:var(--dim);font-weight:600}
.topbar-num{font-size:14px;font-weight:700;color:var(--accent2)}
.pbar{flex:1;min-width:200px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease}

.text-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.text-dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.text-dot:hover{border-color:var(--accent);color:var(--text)}
.text-dot.active{background:var(--accent);border-color:var(--accent);color:#fff}
.text-dot.done{background:var(--correct);border-color:var(--correct);color:#fff}
.text-dot.wrong-done{background:var(--wrong);border-color:var(--wrong);color:#fff}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:20px;animation:fadeUp .4s ease}
.card-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:18px;color:var(--accent2)}

.question-block{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.question-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-text{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:14px;line-height:1.4}
.q-opt:hover:not(.locked){border-color:var(--accent);background:rgba(230,126,34,.06)}
.q-opt.selected{border-color:var(--accent);background:rgba(230,126,34,.12);font-weight:600}
.q-opt.correct-opt{border-color:var(--correct)!important;background:var(--correct-bg)!important;font-weight:700}
.q-opt.wrong-opt{border-color:var(--wrong)!important;background:var(--wrong-bg)!important;text-decoration:line-through;opacity:.7}
.q-opt.locked{cursor:default;opacity:.5}
.q-opt.show-correct{border-color:var(--correct)!important;background:var(--correct-bg)!important;font-weight:700;animation:pulse .3s}
.q-letter{width:26px;height:26px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;transition:all .2s}
.selected .q-letter{background:var(--accent);color:#fff}
.correct-opt .q-letter{background:var(--correct);color:#fff}
.wrong-opt .q-letter{background:var(--wrong);color:#fff}
.show-correct .q-letter{background:var(--correct);color:#fff}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(230,126,34,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(230,126,34,.4)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sec{background:var(--card);color:var(--dim);border:1px solid var(--border)}
.btn-sec:hover{border-color:var(--dim);color:var(--text)}

.results{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 28px;text-align:center;animation:fadeUp .5s}
.res-emoji{font-size:52px;margin-bottom:14px}
.res-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.res-sub{color:var(--dim);font-size:14px;margin-bottom:28px}
.res-score{display:inline-flex;align-items:baseline;gap:6px;background:rgba(230,126,34,.1);border:1px solid var(--accent);padding:14px 32px;border-radius:14px;margin-bottom:28px}
.res-score .big{font-family:'Playfair Display',serif;font-size:44px;color:var(--accent2)}
.res-score .sm{font-size:18px;color:var(--dim)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:280px;margin:0 auto 28px}
.res-stat{padding:12px;border-radius:10px;border:1px solid var(--border)}
.res-stat .n{font-size:20px;font-weight:700}
.res-stat .l{font-size:11px;color:var(--dim);margin-top:2px}
.sc .n{color:var(--correct)} .sw .n{color:var(--wrong)}

.rev-section{margin-top:28px;text-align:left}
.rev-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:18px;text-align:center}
.rev-item{background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rev-hdr{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:8px}
.rev-q{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;flex-wrap:wrap}
.rbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
.rb-ok{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
.rb-no{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}

.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media(max-width:600px){.card{padding:18px 14px}.app{padding:20px 12px 60px}.q-opt{padding:8px 12px;font-size:13px}}
</style>
</head>

const letters=['A','B','C','D'];
let cur=0,ans=[],checked=[],dots_status=[];
function init(){ans=Q.map(q=>q.questions.map(()=>-1));checked=Q.map(()=>false);dots_status=Q.map(()=>'');renderDots();render();}
function renderDots(){let h='';Q.forEach((q,i)=>{let cls=i===cur?'active':'';if(dots_status[i]==='done')cls='done';else if(dots_status[i]==='wrong')cls='wrong-done';h+='<button class="text-dot '+cls+'" onclick="go('+i+')">'+(q.id)+'</button>';});document.getElementById('dots').innerHTML=h;}
function go(i){cur=i;render();renderDots();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
const q=Q[cur],a=ans[cur],ck=checked[cur];
document.getElementById('tLabel').textContent='Texte '+q.id+' / '+Q.length;
let done=checked.filter(Boolean).length;
let total=checked.filter(Boolean).reduce((s,_,i)=>s+Q[i].questions.filter((_,j)=>ans[i][j]===Q[i].questions[j].ans).length,0);
let totalQ=checked.filter(Boolean).length*3;
document.getElementById('tScore').textContent=total+' / '+totalQ+' correct';
document.getElementById('pFill').style.width=Math.round(done/Q.length*100)+'%';
let qh='';
q.questions.forEach((qq,qi)=>{
qh+='<div class="question-block"><div class="q-text">Q'+(qi+1)+'. '+qq.q+'</div><div class="q-opts">';
qq.opts.forEach((o,oi)=>{
let cls='q-opt';
if(ck){cls+=' locked';if(a[qi]===oi&&oi===qq.ans)cls+=' correct-opt';else if(a[qi]===oi&&oi!==qq.ans)cls+=' wrong-opt';else if(oi===qq.ans)cls+=' show-correct';} 
else{if(a[qi]===oi)cls+=' selected';}
qh+='<div class="'+cls+'" onclick="sel('+qi+','+oi+')"><span class="q-letter">'+letters[oi]+'</span><span>'+o+'</span></div>';
});
qh+='</div></div>';
});
let allF=a.every(x=>x>=0);
document.getElementById('quizArea').innerHTML='<div class="card"><div class="card-title">'+q.title+'</div>'+qh+'</div><div class="actions"><button class="btn btn-sec" onclick="prev()" '+(cur===0?'style="visibility:hidden"':'')+'>&larr; Prec.</button>'+(ck?'<button class="btn btn-primary" onclick="nxt()">Suivant &rarr;</button>':'<button class="btn btn-primary" id="ckBtn" onclick="check()" '+(allF?'':' disabled')+'>Verifier &check;</button>')+'</div>';
}
function sel(qi,oi){if(checked[cur])return;ans[cur][qi]=oi;render();}
function check(){
checked[cur]=true;
let allOk=Q[cur].questions.every((qq,qi)=>ans[cur][qi]===qq.ans);
dots_status[cur]=allOk?'done':'wrong';
render();renderDots();
}
function nxt(){if(cur<Q.length-1){cur++;render();renderDots();window.scrollTo({top:0,behavior:"smooth"});}else if(checked.every(Boolean)){showRes();}}
function prev(){if(cur>0){cur--;render();renderDots();window.scrollTo({top:0,behavior:'smooth'});}}
function showRes(){
let tc=0,tg=0,rh='';
Q.forEach((q,qi)=>{let ig='';q.questions.forEach((qq,qj)=>{tg++;let ok=ans[qi][qj]===qq.ans;if(ok)tc++;ig+='<div class="rev-q"><span class="rbadge '+(ok?'rb-ok':'rb-no')+'">'+(ok?'\u2713':'\u2717')+' Q'+(qj+1)+'</span><span>'+(ok?'<b style=color:var(--correct)>'+letters[qq.ans]+'. '+qq.opts[qq.ans]+'</b>':'<span style=color:var(--wrong);text-decoration:line-through>'+letters[ans[qi][qj]]+'. '+(ans[qi][qj]>=0?qq.opts[ans[qi][qj]]:'--')+'</span> &rarr; <b style=color:var(--correct)>'+letters[qq.ans]+'. '+qq.opts[qq.ans]+'</b>')+'</span></div>';});
rh+='<div class="rev-item"><div class="rev-hdr">Texte '+q.id+' - '+q.title+'</div>'+ig+'</div>';});
let pct=Math.round(tc/tg*100);let em='\ud83c\udfc6',msg='Excellent!';
if(pct<50){em='\ud83d\udcda';msg='Continue a pratiquer!';}else if(pct<75){em='\ud83d\udcaa';msg='Pas mal!';}else if(pct<90){em='\ud83c\udf1f';msg='Tres bien!';}
document.getElementById('quizArea').classList.add('hidden');
document.getElementById('resArea').classList.remove('hidden');
document.getElementById('resArea').innerHTML='<div class="results"><div class="res-emoji">'+em+'</div><div class="res-title">'+msg+'</div><div class="res-sub">Score: '+pct+'%</div><div class="res-score"><span class="big">'+tc+'</span><span class="sm">/ '+tg+'</span></div><div class="res-grid"><div class="res-stat sc"><div class="n">'+tc+'</div><div class="l">Correctes</div></div><div class="res-stat sw"><div class="n">'+(tg-tc)+'</div><div class="l">Incorrectes</div></div></div><button class="btn btn-primary" onclick="restart()" style="margin:0 auto">Recommencer</button><div class="rev-section"><div class="rev-title">Detail</div>'+rh+'</div></div>';
window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){location.reload();}
init();
</script>
